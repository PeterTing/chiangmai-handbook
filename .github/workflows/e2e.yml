name: E2E Smoke Test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  e2e:
    name: E2E Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run E2E smoke test
        run: |
          chmod +x ./e2e-smoke.sh
          output=$(./e2e-smoke.sh)
          echo "$output"
          last_line=$(echo "$output" | tail -n 1)
          if [ "$last_line" != "E2E OK" ]; then
            echo "FAIL: last line was '$last_line', expected 'E2E OK'"
            exit 1
          fi
